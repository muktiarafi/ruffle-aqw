[package]
# AQW build: the disk cache for the files the game downloads (src/lib.rs). No Ruffle player, so
# frontends without one can use it too.
name = "ruffle_http_cache"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
# reqwest's header types (reqwest re-exports http 1).
http = "1.3.1"
url = { workspace = true }
tracing = { workspace = true }
